[tool.black]
target-version = ["py311", "py312", "py313"]

[tool.ruff]
extend-exclude = ["*/migrations/*"]  # auto-generated by Django, not hand-lint-checked

[tool.ruff.lint]
extend-select = ["UP", "I", "SIM", "C4", "RUF", "FLY", "PLW1508"]
ignore = [
    "N999", # "Artifactorial" is this project's own real package/app name (on by default, not one of the categories above)
]
